
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Signup Form</title>
</head>
<body>

    <h1>HTML Signup Form</h1>

    <form action="#" method="post">

        <label for="name">Name</label>
        <input type="text" id="name" name="name"
               placeholder="Name" required>
        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="Email" required>
        <br><br>

        <p>Gender</p>
        <input type="radio" id="gender_m" name="gender"
               value="male" required>
        <label for="gender_m">Male</label>

        <input type="radio" id="gender_f" name="gender"
               value="female">
        <label for="gender_f">Female</label>
        <br><br>

        <label for="cars">Car Brands</label>
        <select id="cars" name="cars" required>
            <option value="">--Please choose an option--</option>
            <option value="BMW">BMW</option>
            <option value="Audi">Audi</option>
            <option value="Mercedes">Mercedes</option>
            <option value="Toyota">Toyota</option>
            <option value="Honda">Honda</option>
        </select>
        <br><br>

        <label for="age">Age</label>
        <input type="number" id="age" name="age"
               placeholder="Age" required>
        <br><br>

        <label for="dob">DOB</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="tel">Phone Number</label>
        <input type="tel" id="tel" name="tel"
               placeholder="xxx-xxx-xxxx">
        <br><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Password" required>
        <br><br>

        <input type="checkbox" id="tos" name="tos"
               value="agreed" required>
        <label for="tos">I agree to the TOS</label>
        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
